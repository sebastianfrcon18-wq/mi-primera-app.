<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Primera Web App</title>
  <style>
   /* El fondo general de la pantalla */
    body {
      font-family: Arial, sans-serif;
      background: #0f172a; /* Azul marino muy oscuro */
      color: #f8fafc;       /* Blanco suave para no cansar la vista */
      display: grid;
      place-items: center;
      min-height: 90vh;
      margin: 0;
    }

    /* La tarjeta central */
    .card {
      background: #1e293b; /* Azul pizarra más claro que el fondo */
      padding: 2.5rem;
      border-radius: 16px; /* Esquinas más redondeadas */
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4); /* Sombra elegante */
      border: 1px solid #334155; /* Borde sutil */
    }

    /* El número del contador */
    #contador {
      font-size: 2.5rem;   /* Número mucho más grande */
      font-weight: bold;
      color: #38bdf8;      /* Celeste brillante */
    }

    /* Estilo común para todos los botones */
    button {
      color: white;
      border: none;
      padding: 12px 24px;  /* Más área para hacer clic fácil */
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin: 8px;         /* Separación entre los dos botones */
      transition: transform 0.1s; /* Suavidad al presionar */
    }

    button:active {
      transform: scale(0.95); /* Efecto visual de hundirse al cliquear */
    }

    /* Estilos específicos usando clases individuales */
    .btn-sumar {
      background: #10b981; /* Verde esmeralda */
    }

    .btn-restar {
      background: #ef4444; /* Rojo */
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Probando GitHub Pages</h2>
    <p>Veces clickeado: <span id="contador">0</span></p>
    <button class="btn-sumar" onclick="sumar()">Sumar +1</button>
    <button class="btn-restar" onclick="restar()">Restar -1</button>
  </div>

  <script>
    let n = 0;
    function sumar() {
      n++;
      document.getElementById('contador').textContent = n;
    }
    function restar() {
  n--;
  document.getElementById('contador').textContent = n;
}
  </script>
</body>
</html>
